name: Rate an artwork / 给作品打分
description: Compare the old (v1) and new (v2) pixel art for one artwork and score them.
title: "[Rating] "
labels: ["rating"]
body:
  - type: markdown
    attributes:
      value: |
        See both versions in the gallery: https://andrew-wzj.github.io/claude-pixel-art/
        在画廊里对比两个版本，然后在下面打分。
  - type: dropdown
    id: artwork
    attributes:
      label: Artwork / 作品
      options:
        - "b0 · Mona Leonarda"
        - "b1 · Nail-Filing Slave"
        - "b2 · The Manifestation of the Tomato (in Italy)"
        - "b3 · The Poker Game"
        - "b4 · Really Sick Bacchus"
        - "b5 · Judith Shampooing Holofernes"
        - "b6 · The Apoplectic Cavalier"
        - "b7 · The Turkey Dinner of Dr Tulp"
        - "b8 · Haystacks"
        - "b9 · Mon déjeuner sur l'herbe"
        - "b10 · Ear"
        - "b11 · Pastorales Tahitiennes"
        - "b12 · The Uncontrollable Giggle"
        - "b13 · A Rose Is a Rose Is a Rose Is a Rose"
        - "b14 · American Goths"
        - "b15 · Times Square Traffic Jam"
        - "b16 · Eating Gypsy"
        - "b17 · Ceci est une cigarette"
        - "b18 · Le burger en fourrure"
        - "b19 · Self-Portrait with Beehive"
        - "b20 · Lady Gaga"
        - "b21 · I'm Just Transferring You."
        - "b22 · Untitled Film Still #5022"
        - "b23 · You Just Stepped On My Toe"
        - "b24 · Papa"
        - "b25 · All the Eternal Love I Have for Aubergines"
        - "b26 · How to Explain Pictures to a Dead Man"
        - "b27 · Present"
        - "b28 · The Artist Is Living in Your Home"
        - "b29 · Little Big Pony"
        - "b30 · The Essential Saltiness of the Pickling Process in the Mind of the Consumer"
        - "b31 · Every Pillow I Have Ever Slept With"
        - "b32 · My Homepage"
        - "b33 · Self-Portrait"
        - "b34 · Pop Plane"
        - "b35 · Don't Mess with Missy"
    validations:
      required: true
  - type: dropdown
    id: better
    attributes:
      label: Which version is better? / 哪一版更好？
      options:
        - "v2 (new / 新版)"
        - "v1 (old / 旧版)"
        - "About the same / 差不多"
    validations:
      required: true
  - type: dropdown
    id: v1-score
    attributes:
      label: Score for v1 (old) / 给 v1（旧版）打分
      options:
        - "5 - great / 很好"
        - "4 - good / 好"
        - "3 - okay / 一般"
        - "2 - weak / 较差"
        - "1 - bad / 很差"
    validations:
      required: true
  - type: dropdown
    id: v2-score
    attributes:
      label: Score for v2 (new) / 给 v2（新版）打分
      options:
        - "5 - great / 很好"
        - "4 - good / 好"
        - "3 - okay / 一般"
        - "2 - weak / 较差"
        - "1 - bad / 很差"
    validations:
      required: true
  - type: textarea
    id: comment
    attributes:
      label: What would make it better? (optional) / 还能怎么改进？（选填）
